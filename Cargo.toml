[package]
name = "fio-ext4"
version = "1.3.2"
edition = "2021"
authors = ["Glenn West"]
description = "Async userspace file I/O into an ext2/ext3/ext4 filesystem — read and write files with no kernel, no mount and no loop device"
repository = "https://github.com/glennswest/fio.ext4.rs"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
keywords = ["ext4", "filesystem", "async", "userspace"]
categories = ["filesystem", "asynchronous"]

[lib]
name = "fio_ext4"
path = "src/lib.rs"

[dependencies]
# The on-disk format, the device seam and the read layer all come from here.
#
# Declared by git, not by path: a path dependency inside a git dependency only
# resolves when the path is inside the same repository, so a path here would
# make this crate unusable by anything that takes it by git (fio.ext4.rs#1).
#
# Pinned to a tag rather than a branch, so a consumer's build is reproducible:
# floating on main means two builds a day apart can resolve differently.
# `features = ["std"]` is required as of mkfs-ext4 2.0.0: `std` became a default
# feature so a UEFI driver can link the crate's synchronous read path, which
# means `default-features = false` now leaves the `no_std` core rather than the
# whole crate. This crate is async and wants all of it.
mkfs-ext4 = { git = "https://github.com/glennswest/mkfs.ext4.rs", tag = "v2.0.0", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["fs", "io-std", "io-util", "rt", "sync", "macros"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

# Container layers arrive gzipped; without this they can only be piped through
# an external decompressor first. Optional so a build for a small target can
# leave the compressor out.
async-compression = { version = "0.4", features = ["tokio", "gzip"], optional = true }

clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[features]
default = ["cli", "gzip"]
cli = ["dep:clap", "dep:anyhow", "tokio/rt-multi-thread"]
gzip = ["dep:async-compression"]

[[bin]]
name = "fio-ext4"
path = "src/bin/fio_ext4.rs"
required-features = ["cli"]

# Day-to-day development builds against the sibling checkout, so a change to
# mkfs-ext4 is picked up without a commit and a push. Patch sections apply only
# to the crate being built, so a downstream consumer never sees this and
# resolves the git dependency above.
[patch."https://github.com/glennswest/mkfs.ext4.rs"]
mkfs-ext4 = { path = "../mkfs.ext4.rs" }

[profile.release]
lto = true
