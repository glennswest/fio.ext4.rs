# What fio-ext4-test needs beyond the runner's namespace-only Role
# (stormcentral docs/test-standard.md): nothing. Formatting, filling and
# e2fsck need no privilege. The kernel's half — loop-mount, compare, write —
# is not run in a pod (owner, #5: not as root and not as a privileged pod);
# it runs in a throwaway VM, tests/vm/, booted by `stormcentral testhost
# boot`. Here the kernel checks report skip, never pass. No hardware is
# assumed: images are sparse files in the pod's own temp directory (short
# 64 MiB, medium 3 x 64 MiB, long adds three of 256 MiB, one at a time).
